<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YILIN LU — A Gallery of My Life</title>
    <script>
      (function () {
        var savedTheme;
        try {
          savedTheme = localStorage.getItem('lu-portfolio-theme');
        } catch (error) {
          savedTheme = null;
        }
        document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
      })();
    </script>
    <link rel="stylesheet" href="./fonts/local-fonts.css" />
    <link rel="stylesheet" href="./photography-assets/index-B7ECTXVx.css" />
    <style>
      html {
        color-scheme: dark;
      }
      html[data-theme="light"] {
        color-scheme: light;
        --background: 42 30% 96%;
        --foreground: 205 30% 14%;
        --border: 205 16% 80%;
      }
      body,
      #root,
      #root > div {
        transition: background-color .35s ease, color .35s ease, border-color .35s ease;
      }
      html[data-theme="light"] body,
      html[data-theme="light"] #root,
      html[data-theme="light"] #root > div,
      html[data-theme="light"] .bg-black {
        background-color: #f6f3ed !important;
        color: #172630 !important;
      }
      html[data-theme="light"] [class*="text-white"] {
        color: #172630 !important;
      }
      html[data-theme="light"] [class*="border-white"] {
        border-color: rgba(23, 38, 48, .18) !important;
      }
      html[data-theme="light"] [class*="bg-white/"] {
        background-color: rgba(23, 38, 48, .22) !important;
      }
      html[data-theme="light"] span[style*="background: rgb(255, 255, 255)"] {
        background: #172630 !important;
        box-shadow: 0 0 10px rgba(23, 38, 48, .35) !important;
      }
      html[data-theme="light"] canvas {
        opacity: .38 !important;
        transition: opacity .35s ease;
      }
      @media (prefers-reduced-motion: reduce) {
        body,
        #root,
        #root > div {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./photography-assets/index-zJ8K2fHp.js"></script>
    <script>
      (function () {
        function applyPhotographyTheme(theme) {
          var nextTheme = theme === 'light' ? 'light' : 'dark';
          document.documentElement.dataset.theme = nextTheme;
          document.documentElement.style.colorScheme = nextTheme;
        }

        window.addEventListener('message', function (event) {
          if (event.origin !== window.location.origin) return;
          if (!event.data || event.data.type !== 'lu-portfolio-theme') return;
          applyPhotographyTheme(event.data.theme);
        });

        window.addEventListener('storage', function (event) {
          if (event.key === 'lu-portfolio-theme') applyPhotographyTheme(event.newValue);
        });

        applyPhotographyTheme(document.documentElement.dataset.theme);

        function updatePhotographyLabels() {
          var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
          var node;
          while ((node = walker.nextNode())) {
            var value = node.nodeValue || '';
            var trimmed = value.trim().toUpperCase();

            if (trimmed === '68 WORKS' || trimmed === '27 WORKS' || trimmed === '01 WORKS') {
              node.nodeValue = '';
              continue;
            }
            if (trimmed.includes('MMXXVI')) {
              node.nodeValue = '';
              continue;
            }

            var updated = value
              .replace(/A gallery of light and shadow/gi, 'A GALLERY OF MY LIFE')
              .replace(/POLAROID/gi, 'CCD');
            if (updated !== value) node.nodeValue = updated;

            if (updated.toUpperCase().includes('A GALLERY OF MY LIFE')) {
              var decorativeLine = node.parentElement && node.parentElement.nextElementSibling;
              if (
                decorativeLine &&
                decorativeLine.classList.contains('h-px') &&
                decorativeLine.classList.contains('w-16')
              ) {
                decorativeLine.remove();
              }
            }
          }
        }

        updatePhotographyLabels();
        new MutationObserver(updatePhotographyLabels).observe(document.body, {
          childList: true,
          characterData: true,
          subtree: true
        });
      })();
    </script>
  </body>
</html>
