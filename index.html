    <style>
      #deepscape-project {
        width: 100%;
        min-height: 100vh;
        padding: 9vh 6vw 5vh;
        box-sizing: border-box;
        display: flex;
        background: #05080a;
        color: #fff;
      }
      .deepscape-shell {
        width: 100%;
        max-width: 1440px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 4vh;
      }
      .deepscape-heading {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 32px;
        flex-wrap: wrap;
      }
      .deepscape-video {
        flex: 1;
        min-height: 380px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,.14);
        border-radius: 10px;
        background: #000;
        box-shadow: 0 28px 80px rgba(0,0,0,.45);
      }
      .deepscape-video video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;

        #deepscape-project { min-height: auto; padding: 11vh 7vw 7vh; }

      #snapshot-gallery {

        padding: 9vh 0 10vh;

      .snapshot-shell {
        width: 100%;
        max-width: 1440px;
        margin: 0 auto;
        padding: 0 6vw;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 4vh;
      }
      .snapshot-strip {
        display: flex;
        gap: 18px;
        overflow-x: auto;
        padding: 0 6vw 20px;
        scroll-snap-type: x proximity;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,.25) transparent;
      }
      .snapshot-strip img {
        height: 340px;
        width: auto;
        flex: 0 0 auto;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,.12);
        scroll-snap-align: start;
        display: block;
        background: #0b1014;
      }
      @media (max-width: 720px) {
        #snapshot-gallery { padding: 9vh 0 8vh; }
        .snapshot-strip img { height: 240px; }

  <body>
    <div id="root"></div>

    <div id="deepscape-block" style="display: none;">
      <section id="deepscape-project">
        <div class="deepscape-shell">
          <div class="deepscape-heading">
            <div>
              <p style="margin: 0 0 14px; font-family: 'Noto Sans SC', sans-serif; font-size: 11px; letter-spacing: 0.28em; color: rgba(255,255,255,0.48); text-transform: uppercase;">Featured Project · Interactive Website</p>
              <h2 style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: clamp(32px, 5vw, 64px); font-weight: 300; letter-spacing: 0.08em;">Deepscape Reverie</h2>
              <p style="margin: 14px 0 0; font-family: 'Noto Serif SC', serif; font-size: clamp(18px, 2vw, 28px); font-weight: 300; color: rgba(255,255,255,0.65); letter-spacing: 0.18em;">深景迴梦</p>
            </div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
              <a href="https://610lulu.github.io/Deepscape-Reverie/" target="_blank" rel="noopener noreferrer" style="padding: 12px 20px; border: 1px solid rgba(255,255,255,0.36); border-radius: 999px; color: #fff; text-decoration: none; font-family: 'Noto Sans SC', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;">Open Full Experience ↗</a>
              <a href="https://github.com/610lulu/Deepscape-Reverie" target="_blank" rel="noopener noreferrer" style="padding: 12px 20px; border: 1px solid rgba(255,255,255,0.16); border-radius: 999px; color: rgba(255,255,255,0.7); text-decoration: none; font-family: 'Noto Sans SC', sans-serif; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;">View GitHub</a>
            </div>
          </div>
          <div class="deepscape-video" aria-label="Deepscape Reverie video preview">
            <video
              data-src="./video/deepscape-preview-720p.mp4"
              poster="./images/0604封面.jpg"
              controls
              muted
              loop
              playsinline
              preload="none"
            ></video>
          </div>
        </div>
      </section>
    </div>

    <script>
      (function () {
        function initLazyVideo(section) {
          var video = section.querySelector('video[data-src]');
          if (!video) return;

          function loadVideo() {
            if (!video.dataset.src) return;
            video.src = video.dataset.src;
            video.removeAttribute('data-src');
            video.load();
          }

          if (!('IntersectionObserver' in window)) {
            loadVideo();
            return;
          }

          var videoObserver = new IntersectionObserver(function (entries) {
            if (!entries[0].isIntersecting) return;
            videoObserver.disconnect();
            loadVideo();
          }, { rootMargin: '300px 0px' });

          videoObserver.observe(video);
        }

        function insertDeepscapeBlock() {
          var root = document.getElementById('root');
          var deepscapeBlock = document.getElementById('deepscape-block');
          if (!root || !deepscapeBlock) return;

          var deepscapeSection = deepscapeBlock.querySelector('#deepscape-project');
          if (!deepscapeSection) return;

          // 把 Deepscape 项目放在 Motivation 之后
          var philosophy = root.querySelector('#philosophy');
          if (philosophy) {
            philosophy.appendChild(deepscapeSection);
          } else {
            // 如果找不到，就追加到 root 末尾
            root.appendChild(deepscapeSection);
          }
          initLazyVideo(deepscapeSection);
          deepscapeBlock.remove();
        }

        var root = document.getElementById('root');
        if (!root) return;

        // 监听 React 应用渲染完成
        var observer = new MutationObserver(function () {
          if (root.querySelector('#philosophy')) {
            observer.disconnect();
            insertDeepscapeBlock();
          }
        });
        observer.observe(root, { childList: true, subtree: true });

        // 兜底：页面完全加载后再执行一次
        window.addEventListener('load', function () {
          setTimeout(insertDeepscapeBlock, 100);
        });
      })();
    </script>
    <div id="snapshot-block" style="display: none;">

            <h2 style="margin: 0; font-family: 'Noto Serif SC', serif; font-size: clamp(32px, 5vw, 64px); font-weight: 300; letter-spacing: 0.08em;">灵感快照</h2>
            <p style="margin: 14px 0 0; font-family: 'Noto Sans SC', sans-serif; font-size: 12px; color: rgba(255,255,255,0.4); letter-spacing: 0.08em;">摄影:小红书 @OKMyLittleTelevision</p>

          <img src="./images/xhs-18.jpg" alt="Inspiration photo 18" loading="lazy" />

          <img src="./images/xhs-20.jpg" alt="Inspiration photo 20" loading="lazy" />
          <img src="./images/xhs-21.jpg" alt="Inspiration photo 21" loading="lazy" />
          <img src="./images/xhs-22.jpg" alt="Inspiration photo 22" loading="lazy" />

          <img src="./images/xhs-24.jpg" alt="Inspiration photo 24" loading="lazy" />
        </div>
      </section>
    </div>

    <script>
      (function () {
        function insertSnapshotBlock() {
          var root = document.getElementById('root');
          var block = document.getElementById('snapshot-block');
          if (!root || !block) return;

          var section = block.querySelector('#snapshot-gallery');
          if (!section) return;

          // 照片墙放在 Deepscape 项目之后（或 root 末尾）
          var deepscape = root.querySelector('#deepscape-project');
          if (deepscape && deepscape.parentNode) {
            deepscape.parentNode.insertBefore(section, deepscape.nextSibling);
          } else {
            root.appendChild(section);
          }
          block.remove();
        }

        var root = document.getElementById('root');
        if (!root) return;

        var observer = new MutationObserver(function () {
          if (root.querySelector('#deepscape-project')) {
            observer.disconnect();
            insertSnapshotBlock();
          }
        });
        observer.observe(root, { childList: true, subtree: true });

        window.addEventListener('load', function () {
          setTimeout(insertSnapshotBlock, 300);
        });
      })();
    </script>
