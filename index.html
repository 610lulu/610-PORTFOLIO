          'Contact': 'footer'
        };
        var navigationLabels = Object.keys(navigationTargets);
        var indicatorFrame = 0;

        function pluralizeSectionLabels() {
          var heroTitleLines = document.querySelectorAll('#hero-section h2 span');
          if (heroTitleLines.length >= 2) {
            heroTitleLines[0].textContent = 'Lu';
            heroTitleLines[1].textContent = ' Yilin';
          }
          document.title = 'Lu Portfolio — Lu Yilin';

          document.querySelectorAll('nav button, #gallery h2, footer a, footer span, footer p').forEach(function (node) {
            var label = node.textContent.trim();
            if (label === 'Cooperation Project') node.textContent = 'Cooperation Projects';
            if (label === 'Award & Plan') node.textContent = 'Awards & Plans';
            if (node.matches && node.matches('footer a') && label === 'Selected Works') {
              node.setAttribute('href', '#selected-works');
            }

            var cooperationProjects = [
              'Black River',
              'Temporary Building',
              'NOMAD',
              'AI Intelligent Headphones',
              'Startup Town',
              'HeartLink Mars'

            var cooperationProjectImages = {

              },
              2: {

                alt: 'NOMAD last-mile airport companion product overview'
              }
            };

            galleryGrid.replaceChildren();
            cooperationProjects.forEach(function (projectTitle, index) {
              var projectNumber = String(index + 1).padStart(2, '0');
              var placeholder = document.createElement('article');
              placeholder.className = 'selected-work-card selected-work-placeholder cooperation-project-placeholder';
              placeholder.setAttribute('aria-label', projectNumber + '. ' + projectTitle + ' placeholder');

              var placeholderMedia = document.createElement('div');
              placeholderMedia.className = 'selected-work-media';

      (function () {

          var root = document.getElementById('root');

          if (!section) return;

          var photography = root.querySelector('#photography-project');
          if (photography && photography.parentNode) {

          } else {
            root.appendChild(section);
          }
          startSnapshotAutoscroll(section.querySelector('.snapshot-strip'));
          block.remove();
        }

        function startSnapshotAutoscroll(strip) {
          if (!strip || strip.dataset.autoscrollReady) return;
          strip.dataset.autoscrollReady = 'true';

          var originalImages = Array.from(strip.children);
          originalImages.forEach(function (image) {
            var clone = image.cloneNode(true);
            clone.setAttribute('aria-hidden', 'true');
            clone.removeAttribute('alt');
            strip.appendChild(clone);
          });
          var firstClone = strip.children[originalImages.length];

          var previousTime = performance.now();
          var speed = 42;

          function frame(currentTime) {
            var elapsed = Math.min(currentTime - previousTime, 50);
            previousTime = currentTime;

            if (!document.hidden) {
              strip.scrollLeft += speed * elapsed / 1000;
              var loopWidth = firstClone.offsetLeft - originalImages[0].offsetLeft;
              if (loopWidth > 0 && strip.scrollLeft >= loopWidth) {
                strip.scrollLeft -= loopWidth;
              }
            }
            requestAnimationFrame(frame);
          }

          requestAnimationFrame(frame);
        }

        var root = document.getElementById('root');
        if (!root) return;

        var observer = new MutationObserver(function () {
          if (root.querySelector('#photography-project')) {
            observer.disconnect();
            insertSnapshotBlock();
          }
        });
        observer.observe(root, { childList: true, subtree: true });

        window.addEventListener('load', function () {
          setTimeout(insertSnapshotBlock, 300);
        });
      })();

        var updatedFooterCopy = "If my work resonates with you, I'd love to hear from you. This entire website was designed and built by me.";

        function updateFooterCopy() {
          var footer = document.getElementById('footer');
          if (!footer) return;
          var walker = document.createTreeWalker(footer, NodeFilter.SHOW_TEXT);
          var node;
          while ((node = walker.nextNode())) {
            if ((node.nodeValue || '').trim() === originalFooterCopy) {
              node.nodeValue = updatedFooterCopy;
            }
          }
        }

        updateFooterCopy();
        new MutationObserver(updateFooterCopy).observe(
          document.getElementById('root'),
          { childList: true, characterData: true, subtree: true }
        );
      })();
    </script>
    <script>
      (function () {
        var youtubeUrl = 'https://www.youtube.com/@610lulu';

        function addYouTubeSocialLink() {
          var footer = document.getElementById('footer');
          if (!footer || footer.querySelector('a[href="' + youtubeUrl + '"]')) return;

          var headings = footer.querySelectorAll('p');
          var socialHeading = Array.prototype.find.call(headings, function (heading) {
            return (heading.textContent || '').trim().toLowerCase() === 'social';
          });
          var linkList = socialHeading && socialHeading.nextElementSibling;
          var referenceLink = linkList && linkList.querySelector('a');
          if (!referenceLink) return;

          var youtubeLink = document.createElement('a');
          youtubeLink.href = youtubeUrl;
          youtubeLink.textContent = 'YouTube';
          youtubeLink.style.cssText = referenceLink.style.cssText;
          youtubeLink.addEventListener('mouseenter', function () {
            youtubeLink.style.opacity = '1';
          });
          youtubeLink.addEventListener('mouseleave', function () {
            youtubeLink.style.opacity = '0.6';
          });
          linkList.appendChild(youtubeLink);
        }

        addYouTubeSocialLink();
        new MutationObserver(addYouTubeSocialLink).observe(
          document.getElementById('root'),
          { childList: true, subtree: true }
        );
      })();
