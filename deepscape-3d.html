<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fast 3D preview of the Deepscape Reverie school corridor scene." />
    <title>Deepscape Reverie · Fast 3D Scene</title>
    <link rel="stylesheet" href="./deepscape-3d/scene.css?v=fast3d-1" />
    <script type="module" src="./deepscape-3d/scene.js?v=fast3d-1"></script>
  </head>
  <body>
    <main class="scene-page" id="sceneWalk">
      <section class="scene-viewer" aria-label="Deepscape Reverie school corridor 3D scene">
        <img
          class="scene-poster"
          src="./deepscape-3d/sunlit-red-passage-poster.jpg"
          alt="Rendered school corridor with a red passage, concrete columns, warm sunlight, and tree shadows."
          decoding="async"
        />
        <div class="scene-canvas" id="walkCanvas" aria-hidden="true"></div>
        <div class="scene-shade" aria-hidden="true"></div>
        <div class="scene-ui">
          <a class="back-link" href="./deepscape-reverie.html">Back to project</a>
          <p class="eyebrow">Deepscape Reverie · Fast 3D Preview</p>
          <h1>School Corridor</h1>
          <p class="intro">A lighter standalone version of the Blender scene, with baked light and four camera stops.</p>
          <div class="controls">
            <button class="primary" id="walkLaunch3d" type="button" aria-pressed="false">Enter 3D</button>
            <button id="walkReset3d" type="button" hidden>Reset</button>
            <button id="walkFullscreen3d" type="button" hidden>Fullscreen</button>
          </div>
          <p class="status" id="walk3dStatus" role="status" aria-live="polite">Poster loaded. 3D loads only after you click.</p>
          <div class="stops" aria-label="Camera stops">
            <button class="stop active" type="button" data-stop="0">01</button>
            <button class="stop" type="button" data-stop="1">02</button>
            <button class="stop" type="button" data-stop="2">03</button>
            <button class="stop" type="button" data-stop="3">04</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
